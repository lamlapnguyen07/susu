<title>排版比較｜食在好蔬</title>

<style>body{margin:0;background:#f3f5ee;color:#1f2a22;font:16px/1.8 'Noto Sans TC',sans-serif}main{max-width:1080px;margin:0 auto;padding:48px 24px}
h1{font-size:1.8rem;margin:0 0 6px}p{margin:0 0 1em;color:#56625a}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:28px}
.v{background:#fff;border:1px solid #dde3d4;border-radius:12px;padding:24px}.v h2{margin:0 0 6px;font-size:1.25rem}.v ul{padding-left:1.1em;margin:0 0 16px;color:#56625a;font-size:15px}

<body><main><h1>三種排版方向</h1><p>配色都一樣，只比較排版和字型。每一版都有首頁和「我們的好蔬」頁。</p>
<div class="grid">
<div class="v"><h2>A 版・雜誌留白</h2><ul><li>內容置中、留白多，照片有圓角</li><li>標題用明體，內文用黑體</li><li>好蔬頁是三欄卡片，吃法點開才看</li></ul><a href="a/index.html">首頁</a><a href="a/veggies.html">好蔬頁</a></div>
<div class="v"><h2>B 版・清爽商店</h2><ul><li>全站只用一種黑體，像購物網站</li><li>首頁大橫幅＋採收標籤列</li><li>好蔬頁左側目錄可跳轉，資訊分格</li></ul><a href="b/index.html">首頁</a><a href="b/veggies.html">好蔬頁</a></div>
<div class="v"><h2>C 版・農場筆記</h2><ul><li>單欄窄版，像在讀一本農場手記</li><li>標題和內文都用明體，按鈕用黑體</li><li>好蔬頁開頭有目錄，一種菜一篇</li></ul><a href="c/index.html">首頁</a><a href="c/veggies.html">好蔬頁</a></div>
</div></main></body></html>
